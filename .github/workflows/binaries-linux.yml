name: Binaries Ubuntu (linux-gcc)

on:
  workflow_dispatch:
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm, ubuntu-24.04, ubuntu-24.04-arm, ubuntu-26.04, ubuntu-26.04-arm ]  # Specify the Ubuntu version

    runs-on: ${{ matrix.os }}
    env:
      APPIMAGE_ARCH: ${{ endsWith(matrix.os, '-arm') && 'aarch64' || 'x86_64' }}
    steps:
    - uses: actions/checkout@v6

    - name: Update indices
      run: |
           sudo apt update     
    - name: Pin the kernel tag of the Ubuntu release
      run: |
           ## The release asset name carries the kernel the distribution
           ## ships with (linux-6-...-ubuntu-24), not the kernel of the CI
           ## runner - the arm runners run a much newer kernel, which used
           ## to publish linux-7-aarch64-ubuntu-24 next to
           ## linux-6-x86_64-ubuntu-24 for the same Ubuntu 24.04.
           case "${{ matrix.os }}" in
             ubuntu-22.04*) echo "KERNEL=6" >> $GITHUB_ENV ;;
             ubuntu-24.04*) echo "KERNEL=6" >> $GITHUB_ENV ;;
             ubuntu-26.04*) echo "KERNEL=7" >> $GITHUB_ENV ;;
             *)             echo "KERNEL=`uname -r | grep -oE '^[0-9]'`" >> $GITHUB_ENV ;;
           esac
    - name: developer library installs
      run: |
           sudo apt install build-essential
           sudo apt install desktop-file-utils
           sudo apt install libxt-dev libxft-dev
           export VRS=`grep -E '^#define me(YEAR|MONTH|DAY)' src/evers.h | awk '{ print $3 }' | paste -sd '' | sed 's/"//g'`
           echo "VRS=$VRS" >> $GITHUB_ENV
    - name: Extract branch name
      run: echo "BRANCH_NAME=${GITHUB_REF#refs/heads/}" >> $GITHUB_ENV
        
    - name: make bfs binary
      run:  make -f makefiles/unixgcc.gmk KERNEL=$KERNEL bfs/bin

    - name: make mec binary       
      run:  make -f makefiles/unixgcc.gmk KERNEL=$KERNEL mec

    - name: make mew binary       
      run:  make -f makefiles/unixgcc.gmk KERNEL=$KERNEL mew

    - name: make mecw binary       
      run:  make -f makefiles/unixgcc.gmk KERNEL=$KERNEL mecw

    - name: make mecb binary
      run:  |
        make -f makefiles/unixgcc.gmk KERNEL=$KERNEL mecb
    
    - name: make mewb binary
      run:  make -f makefiles/unixgcc.gmk KERNEL=$KERNEL mewb
    
    - name: make mecwb binary
      run:  make -f makefiles/unixgcc.gmk KERNEL=$KERNEL mecwb

    # Smoke test: the standalone mecb must be executable and report its version
    - name: Smoke test mecb -V
      run: |
           for b in *-mecb.bin; do
             echo "== $b"
             "./$b" -V
           done

    - name: Install AppImage build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libfuse2 fakeroot squashfs-tools

    # The published standalone appimage-builder AppImage is x86_64 only.
    - name: Install appimage-builder (x86_64)
      if: ${{ env.APPIMAGE_ARCH == 'x86_64' }}
      run: |
        mkdir -p "$HOME/.local/bin"
        wget -q -O "$HOME/.local/bin/appimage-builder" \
          https://github.com/AppImageCrafters/appimage-builder/releases/download/v1.1.0/appimage-builder-1.1.0-x86_64.AppImage
        chmod +x "$HOME/.local/bin/appimage-builder"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Install appimage-builder (AArch64)
      if: ${{ env.APPIMAGE_ARCH == 'aarch64' }}
      run: |
        sudo apt-get install -y pipx
        pipx install appimage-builder==1.1.0
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Build AppImage
      env:
        # Extract-and-run avoids FUSE in CI; end users still need libfuse2.
        APPIMAGE_EXTRACT_AND_RUN: "1"
      run: |
        appimage-builder --version
        make -f makefiles/unixgcc.gmk app-image \
          APPIMAGE_ARCH="$APPIMAGE_ARCH" \
          APPIMAGE_PLATFORM_SUFFIX=_${{ matrix.os }}
        ls -lh Jasspa_MicroEmacs_${VRS}_${{ matrix.os }}_${APPIMAGE_ARCH}.AppImage

    - name: Upload AppImage
      uses: actions/upload-artifact@v6
      with:
        name: appimage-${{ matrix.os }}-${{ env.APPIMAGE_ARCH }}-${{ env.VRS }}-${{ env.BRANCH_NAME }}
        path: Jasspa_MicroEmacs_${{ env.VRS }}_${{ matrix.os }}_${{ env.APPIMAGE_ARCH }}.AppImage

    - name: make brew package
      run:  |
        make -f makefiles/unixgcc.gmk KERNEL=$KERNEL brew
        rm -rf brew-*/          
    
    - name: Make release
      run: |
        export MEPATH=${{ matrix.os }}-MicroEmacs09-${VRS}-Linux
        mkdir $MEPATH
        mkdir $MEPATH/bin
        mkdir -p $MEPATH/man/1   
        mkdir -p $MEPATH/share/jasspa
        mkdir $MEPATH/share/spelling
        mkdir $MEPATH/share/company        
        cp doc/me.1 $MEPATH/man/1/
        cp bfs/bfs $MEPATH/bin/
        cp src/.linuxgcc-release-mecw-xft/mecw $MEPATH/bin/
        cp src/.linuxgcc-release-mew-xft/mew $MEPATH/bin/
        cp src/.linuxgcc-release-mec/mec  $MEPATH/bin/
        cp linux-*me*.bin $MEPATH/bin/
        cp license.txt $MEPATH/share/jasspa/
        cp COPYING $MEPATH/share/jasspa/
        cp docs/README-standalone.md $MEPATH/share/jasspa/
        cp -r jasspa/macros $MEPATH/share/jasspa/
        echo "Documentation is in share/jasspa" > ${MEPATH}/readme.txt

    - name: Make mecb release
      run: |
        mkdir ${{ matrix.os }}-MicroEmacs09-${VRS}-Linux-mecb
        mkdir ${{ matrix.os }}-MicroEmacs09-${VRS}-Linux-mecb/bin
        cp bfs/bfs ${{ matrix.os }}-MicroEmacs09-${VRS}-Linux-mecb/bin/
        cp linux-*mecb.bin ${{ matrix.os }}-MicroEmacs09-${VRS}-Linux-mecb/bin/
        cp license.txt ${{ matrix.os }}-MicroEmacs09-${VRS}-Linux-mecb/
        cp COPYING ${{ matrix.os }}-MicroEmacs09-${VRS}-Linux-mecb/
        cp docs/README-standalone.md ${{ matrix.os }}-MicroEmacs09-${VRS}-Linux-mecb/

    - name: Make mewb release
      run: |
        mkdir ${{ matrix.os }}-MicroEmacs09-${VRS}-Linux-mewb
        mkdir ${{ matrix.os }}-MicroEmacs09-${VRS}-Linux-mewb/bin
        cp bfs/bfs ${{ matrix.os }}-MicroEmacs09-${VRS}-Linux-mewb/bin/
        cp linux-*mewb.bin ${{ matrix.os }}-MicroEmacs09-${VRS}-Linux-mewb/bin/
        cp license.txt ${{ matrix.os }}-MicroEmacs09-${VRS}-Linux-mewb/
        cp COPYING ${{ matrix.os }}-MicroEmacs09-${VRS}-Linux-mewb/
        cp docs/README-standalone.md ${{ matrix.os }}-MicroEmacs09-${VRS}-Linux-mewb/

    - name: Make mecwb release
      run: |
        mkdir ${{ matrix.os }}-MicroEmacs09-${VRS}-Linux-mecwb
        mkdir ${{ matrix.os }}-MicroEmacs09-${VRS}-Linux-mecwb/bin
        cp bfs/bfs ${{ matrix.os }}-MicroEmacs09-${VRS}-Linux-mecwb/bin/
        cp linux-*mecwb.bin ${{ matrix.os }}-MicroEmacs09-${VRS}-Linux-mecwb/bin/
        cp license.txt ${{ matrix.os }}-MicroEmacs09-${VRS}-Linux-mecwb/
        cp COPYING ${{ matrix.os }}-MicroEmacs09-${VRS}-Linux-mecwb/
        cp docs/README-standalone.md ${{ matrix.os }}-MicroEmacs09-${VRS}-Linux-mecwb/

    - name: Upload Ubuntu Release files
      uses: actions/upload-artifact@v6
      with: 
        name: ${{ matrix.os }}-MicroEmacs09-${{ env.VRS }}-Linux-${{ env.BRANCH_NAME }}
        path: ${{ matrix.os }}-MicroEmacs09-${{ env.VRS }}-Linux
    
    - name: Upload Ubuntu mecb Release files
      uses: actions/upload-artifact@v6
      with: 
        name: ${{ matrix.os }}-MicroEmacs09-${{ env.VRS }}-Linux-mecb-${{ env.BRANCH_NAME }}
        path: ${{ matrix.os }}-MicroEmacs09-${{ env.VRS }}-Linux-mecb

    - name: Upload Ubuntu mewb Release files
      uses: actions/upload-artifact@v6
      with: 
        name: ${{ matrix.os }}-MicroEmacs09-${{ env.VRS }}-Linux-mewb-${{ env.BRANCH_NAME }}
        path: ${{ matrix.os }}-MicroEmacs09-${{ env.VRS }}-Linux-mewb

    - name: Upload Ubuntu mecwb Release files
      uses: actions/upload-artifact@v6
      with: 
        name: ${{ matrix.os }}-MicroEmacs09-${{ env.VRS }}-Linux-mecwb-${{ env.BRANCH_NAME }}
        path: ${{ matrix.os }}-MicroEmacs09-${{ env.VRS }}-Linux-mecwb

    - name: Combined Release
      run: |
        make -f makefiles/unixgcc.gmk KERNEL=$KERNEL release app=mecb
        make -f makefiles/unixgcc.gmk KERNEL=$KERNEL release app=mewb
        make -f makefiles/unixgcc.gmk KERNEL=$KERNEL release app=mecwb
        export DIR=`ls linux-*-mecb.bin | sed 's/-mecb.bin//'`
        echo $DIR

    - name: Test release checksums
      run: |
        ls -l linux-*/ || true
        ## each packaging run must have produced non-empty archives and the
        ## sha256 checksum file written by makefiles/release.gmk
        for d in linux-*/; do
          d="${d%/}"
          test -s "${d}/${d}.sha256" || { echo "missing checksum: ${d}/${d}.sha256"; exit 1; }
          for z in "${d}"/*.zip; do
            test -s "${z}" || { echo "empty artifact: ${z}"; exit 1; }
          done
          ( cd "${d}" && sha256sum -c "${d}.sha256" )
        done

    - name: Upload Ubuntu Combined Release
      uses: actions/upload-artifact@v6
      with: 
        name: Release-${{ matrix.os }}-${{ env.BRANCH_NAME }}
        path: linux-*/
        
    - name: Upload Brew Package
      uses: actions/upload-artifact@v6
      with: 
        name: brew-${{ matrix.os }}
        path: brew-*
