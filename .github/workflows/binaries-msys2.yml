name: Binaries Windows-Msys2

on:
  workflow_dispatch:
    branches: [ master ]
env:
   VERSION: "091226b2"
jobs:
  build:
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { sys: mingw32, runs-on: 'windows-latest', subsystem: msys }
          - { sys: mingw64, runs-on: 'windows-latest', subsystem: msys }
          - { sys: ucrt64, runs-on: 'windows-latest', subsystem: msys }
          - { sys: mingw32, runs-on: 'windows-latest', subsystem: mingw }
          - { sys: mingw64, runs-on: 'windows-latest', subsystem: mingw }
          - { sys: ucrt64, runs-on: 'windows-latest', subsystem: mingw }
    name: ${{ matrix.subsystem }} ${{ matrix.sys }}
    defaults:
      run:
        shell: msys2 {0}
    steps:
    - name: 'Checkout'
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        persist-credentials: false    
    - name: Setup MSYS2     
      uses: msys2/setup-msys2@v2
      with:
        update: true
        msystem: ${{ matrix.sys }}
        install: >-
           curl
           git
           make
           unzip 
           zip
    - name: Install MSYS packages
      if: matrix.subsystem == 'msys'
      run: |
         pacman -S --noconfirm gcc ncurses ncurses-devel zlib zlib-devel
    - name: Install MinGW packages
      if: matrix.subsystem == 'mingw'
      run: |
         case "${{ matrix.sys }}" in
           mingw32) PKGPFX="mingw-w64-i686" ;;
           mingw64) PKGPFX="mingw-w64-x86_64" ;;
           ucrt64)  PKGPFX="mingw-w64-ucrt-x86_64" ;;
           *)       echo "Unknown sys: ${{ matrix.sys }}"; exit 1 ;;
         esac
         pacman -S --noconfirm ${PKGPFX}-gcc ${PKGPFX}-ncurses ${PKGPFX}-zlib
    - name: compile bfs executable
      run: |
         gcc --version
         uname -a
         uname -m
         cd bfs
         make -f winmingwgcc.gmk
         ls -la
         cd ..

    - name: compile mec executable
      run: |
         cd src
         if [ "${{ matrix.subsystem }}" = "mingw" ]; then
           make -f winmingwgcc.mak BDIST=mingw64 BTYP=c all
           BUILDDIR=".mingw64gcc-release-mec"
         else
           make -f winmingwgcc.mak BTYP=c all
           BUILDDIR=".msys64gcc-release-mec"
         fi
         ls -la
         ./${BUILDDIR}/mec32.exe -V
         cd ..
    - name: compile mew executable
      run: |
         cd src
         if [ "${{ matrix.subsystem }}" = "mingw" ]; then
           make -f winmingwgcc.mak BDIST=mingw64 BTYP=w all
         else
           make -f winmingwgcc.mak BTYP=w all
         fi
         ls -la
         cd ..
    - name: create mecb executable
      run: |
         if [ "${{ matrix.subsystem }}" = "mingw" ]; then
           make -f winmingwgcc.gmk BDIST=mingw64 mecb
         else
           make -f winmingwgcc.gmk mecb
         fi
    - name: create mewb executable
      run: |
         if [ "${{ matrix.subsystem }}" = "mingw" ]; then
           make -f winmingwgcc.gmk BDIST=mingw64 mewb
         else
           make -f winmingwgcc.gmk mewb
         fi

    - name: create Release executable
      run: |
         if [ "${{ matrix.subsystem }}" = "mingw" ]; then
           make -f winmingwgcc.gmk BDIST=mingw64 release app=mecb
           make -f winmingwgcc.gmk BDIST=mingw64 release app=mewb
         else
           make -f winmingwgcc.gmk release app=mecb
           make -f winmingwgcc.gmk release app=mewb
         fi
         ls
    
    - name: Upload Release
      uses: actions/upload-artifact@v6
      with: 
        name: Release-${{ matrix.subsystem }}-${{ matrix.sys }}-${{ env.VERSION }}
        path: windows-msys-microemacs*
