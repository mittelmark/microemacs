  windows-ucrt64:
    runs-on: windows-latest
    name: Test on Windows (UCRT64)
    steps:
      - uses: actions/checkout@v6
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ucrt64
          install: mingw-w64-x86_64-gcc make
      - name: Build mec (console)
        shell: msys2 {0}
        run: |
          cd src
          make -f winmingwgcc.mak BTYP=c all BDIST=mingw64
      - name: Run basic tests
        shell: msys2 {0}
        run: |
          ls src/
          MEPATH=jasspa/macros src/.ucrt64win-release-mec/mec.exe @tests/test-basics 2>/dev/null || true
          cat tests/test-output.txt
          MEPATH=jasspa/macros src/.ucrt64win-release-mec/mec.exe @tests/test-enc17-mn 2>/dev/null || true
          MEPATH=jasspa/macros src/.ucrt64win-release-mec/mec.exe @tests/test-encoding-detect 2>/dev/null || true
          MEPATH=jasspa/macros src/.ucrt64win-release-mec/mec.exe @tests/test-pview 2>/dev/null || true
          MEPATH=jasspa/macros src/.ucrt64win-release-mec/mec.exe @tests/test-pview-toolbar 2>/dev/null || true
      - name: Verify test results
        shell: msys2 {0}
        run: |
          if [ -s tests/test-output.txt ]; then
            echo "Tests produced output"
            grep -q "TEST:version=" tests/test-output.txt && echo "PASS: version test" || echo "FAIL: version test"
            grep -q "TEST:all-tests=complete" tests/test-output.txt && echo "PASS: all tests completed" || echo "FAIL: all tests did not complete"
            grep -q "TEST:nested-while=64" tests/test-output.txt && echo "PASS: nested while test" || { echo "FAIL: nested while test"; exit 1; }
            grep -q "TEST:unicode=αβγ" tests/test-output.txt && echo "PASS: unicode test" || { echo "FAIL: unicode test"; exit 1; }
            grep -q "TEST:utf8-strfuncs=ok" tests/test-output.txt && echo "PASS: utf8 string functions test" || { echo "FAIL: utf8 string functions test"; exit 1; }
            grep -q "TEST:func-lookup=ok" tests/test-output.txt && echo "PASS: function lookup test" || { echo "FAIL: function lookup test"; exit 1; }
            grep -q "TEST:scroll-bob=ok" tests/test-output.txt && echo "PASS: scroll top test" || { echo "FAIL: scroll top test"; exit 1; }
            grep -q "TEST:scroll-eob=ok" tests/test-output.txt && echo "PASS: scroll end test" || { echo "FAIL: scroll end test"; exit 1; }
          else
            echo "FAIL: No test output produced"
            exit 1
          fi
      - name: Upload test results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-results-windows-mingw
          path: tests/test-output.txt
      - name: Verify encoding tests (ticket 17)
        shell: msys2 {0}
        run: |
          sh tests/check-enc17.sh || { echo "FAIL: encoding tests (ticket 17)"; exit 1; }
      - name: Verify encoding auto-detection (ticket 14)
        shell: msys2 {0}
        run: |
          grep -q "TEST:late-cp1252-encoding=Windows-1252" tests/test-encoding-detect-out.txt || { echo "FAIL: late CP1252 detection"; exit 1; }
          grep -q "TEST:late-utf8-encoding=UTF-8" tests/test-encoding-detect-out.txt || { echo "FAIL: late UTF-8 detection"; exit 1; }
          grep -q "TEST:hklatex-encoding=Windows-1252" tests/test-encoding-detect-out.txt || { echo "FAIL: hklatex detection"; exit 1; }
          grep -q "TEST:all-tests=complete" tests/test-encoding-detect-out.txt || { echo "FAIL: encoding detection test incomplete"; exit 1; }
      - name: Verify pview tests (ticket 11)
        shell: msys2 {0}
        run: |
          grep -q "TEST:pview-expanded-nested=yes" tests/test-pview-output.txt || { echo "FAIL: pview nested expansion"; exit 1; }
          grep -q "TEST:pview-git-unquote-ok=yes" tests/test-pview-output.txt || { echo "FAIL: pview git unquote"; exit 1; }
          grep -q "TEST:all-tests=complete" tests/test-pview-output.txt || { echo "FAIL: pview test incomplete"; exit 1; }
          grep -q "TEST:tool-loaded=1" tests/test-pview-toolbar-output.txt || { echo "FAIL: pview toolbar lazy load"; exit 1; }
          grep -q "TEST:mouse-ok=yes" tests/test-pview-toolbar-output.txt || { echo "FAIL: pview toolbar mouse"; exit 1; }
          grep -q "TEST:all-tests=complete" tests/test-pview-toolbar-output.txt || { echo "FAIL: pview toolbar test incomplete"; exit 1; }
      - name: Mouse-wheel regression test (ticket 22)
        timeout-minutes: 3
        shell: msys2 {0}
        run: |
          # The native Windows console build uses src/winterm.c. A CI step
          # has no console, so AllocConsole() would otherwise succeed and
          # mec would read that new (empty) console instead of our pipe;
          # ME_CONSOLE_PIPEMODE forces the raw "pipe mode" SGR path fixed
          # for ticket 22.
          #
          # The report is repeated ~1s apart rather than sent once up front:
          # ME runs a TTahead()/TTinflush() during start-up which reads and
          # discards input already waiting in the pipe. A single early report
          # was swallowed, after which the closed pipe gave EOF and mec called
          # meDie() -> exit 1 with no file written. Keeping the pipe open and
          # writing after start-up makes the report land in the main loop.
          export TERM=xterm-256color
          export TERM_PROGRAM="Windows Terminal"
          export ME_CONSOLE_PIPEMODE=1
          export ME_MOUSE_WORK=mwtest
          rm -rf mwtest && mkdir -p mwtest
          echo "--- wheel-down (SGR button 65) ---"
          rc=0
          { for _i in 1 2 3 4 5 6 7 8; do sleep 1; printf '\033[<65;5;5M' || break; done; sleep 2; } \
            | MEPATH=jasspa/macros timeout 30 src/.ucrt64win-release-mec/mec.exe @tests/mouse-wheel-win > mwtest/console-down.out 2>&1 || rc=$?
          echo "mec exit=$rc"
          head -c 200 mwtest/console-down.out 2>/dev/null | cat -v; echo
          cat mwtest/mouse-wheel-win-out.txt 2>/dev/null || echo "(no output)"
          grep -q 'wheel=down' mwtest/mouse-wheel-win-out.txt
          rm -f mwtest/mouse-wheel-win-out.txt
          echo "--- wheel-up (SGR button 64) ---"
          rc=0
          { for _i in 1 2 3 4 5 6 7 8; do sleep 1; printf '\033[<64;5;5M' || break; done; sleep 2; } \
            | MEPATH=jasspa/macros timeout 30 src/.ucrt64win-release-mec/mec.exe @tests/mouse-wheel-win > mwtest/console-up.out 2>&1 || rc=$?
          echo "mec exit=$rc"
          head -c 200 mwtest/console-up.out 2>/dev/null | cat -v; echo
          cat mwtest/mouse-wheel-win-out.txt 2>/dev/null || echo "(no output)"
          grep -q 'wheel=up' mwtest/mouse-wheel-win-out.txt
      - name: Mouse-modifier regression test
        timeout-minutes: 3
        shell: msys2 {0}
        run: |
          # Pipes one SGR click report per run, with a Shift/Alt/Control
          # modifier bit in the button number, and checks each reaches the
          # matching binding (see tests/mouse-mod-win.sh).
          sh tests/mouse-mod-win.sh src/.ucrt64win-release-mec/mec.exe || { echo "FAIL: mouse modifier test"; exit 1; }

  windows-msysunix:
    runs-on: windows-latest
    name: Test on Windows (MSYS2 mintty)
    steps:
      - uses: actions/checkout@v6
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ucrt64
          install: make
      - name: Install MSYS packages
        shell: msys2 {0}
        run: |
          pacman -S --noconfirm gcc ncurses ncurses-devel zlib zlib-devel util-linux
      - name: Build mec (console, msys2unix)
        shell: msys2 {0}
        run: |
          cd src
          make -f winmingwgcc.mak print-info
          make -f winmingwgcc.mak BTYP=c all BDIST=msys2unix
      - name: Run basic tests
        timeout-minutes: 10
        shell: msys2 {0}
        run: |
          ls src/
          export TERM=xterm
          script -q -c "MEPATH=jasspa/macros src/.ucrt64unix-release-mec/mec.exe @tests/test-basics" /dev/null 2>/dev/null || true
          cat tests/test-output.txt
          script -q -c "MEPATH=jasspa/macros src/.ucrt64unix-release-mec/mec.exe @tests/test-enc17-mn" /dev/null 2>/dev/null || true
      - name: Verify test results
