name: Testing MicroEmacs basic features

on:
  workflow_dispatch:
  push:
    branches: [ devel ]

jobs:
  linux:
    runs-on: ubuntu-22.04
    name: Test on Linux
    steps:
      - uses: actions/checkout@v6
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libxt-dev
      - name: Build mec (console)
        run: make -f makefiles/unixgcc.gmk mec
      - name: Run basic tests
        run: |
          #rm -f tests/test-output.txt
          echo "VRS=$VRS" >> $GITHUB_ENV
          export TERM=xterm
          MEPATH=jasspa/macros ./src/.linuxgcc-release-mec/mec @tests/test-basics 2>/dev/null || true
          cat tests/test-output.txt
          MEPATH=jasspa/macros ./src/.linuxgcc-release-mec/mec @tests/test-enc17-mn 2>/dev/null || true
          MEPATH=jasspa/macros ./src/.linuxgcc-release-mec/mec @tests/test-encoding-detect 2>/dev/null || true
          MEPATH=jasspa/macros ./src/.linuxgcc-release-mec/mec @tests/test-pview 2>/dev/null || true
          MEPATH=jasspa/macros ./src/.linuxgcc-release-mec/mec @tests/test-pview-toolbar 2>/dev/null || true
      - name: Verify test results
        run: |
          if [ -s tests/test-output.txt ]; then
            echo "Tests produced output"
            grep -q "TEST:version=" tests/test-output.txt && echo "PASS: version test" || echo "FAIL: version test"
            grep -q "TEST:all-tests=complete" tests/test-output.txt && echo "PASS: all tests completed" || echo "FAIL: all tests did not complete"
            grep -q "TEST:nested-while=64" tests/test-output.txt && echo "PASS: nested while test" || { echo "FAIL: nested while test"; exit 1; }
            grep -q "TEST:unicode=αβγ" tests/test-output.txt && echo "PASS: unicode test" || { echo "FAIL: unicode test"; exit 1; }
            grep -q "TEST:utf8-strfuncs=ok" tests/test-output.txt && echo "PASS: utf8 string functions test" || { echo "FAIL: utf8 string functions test"; exit 1; }
            grep -q "TEST:func-lookup=ok" tests/test-output.txt && echo "PASS: function lookup test" || { echo "FAIL: function lookup test"; exit 1; }
            grep -q "TEST:scroll-bob=ok" tests/test-output.txt && echo "PASS: scroll top test" || { echo "FAIL: scroll top test"; exit 1; }
            grep -q "TEST:scroll-eob=ok" tests/test-output.txt && echo "PASS: scroll end test" || { echo "FAIL: scroll end test"; exit 1; }
          else
            echo "FAIL: No test output produced"
            exit 1
          fi
      - name: Upload test results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-results-linux
          path: tests/test-output.txt
      - name: Verify encoding tests (ticket 17)
        run: |
          sh tests/check-enc17.sh || { echo "FAIL: encoding tests (ticket 17)"; exit 1; }
      - name: Verify encoding auto-detection (ticket 14)
        run: |
          grep -q "TEST:late-cp1252-encoding=Windows-1252" tests/test-encoding-detect-out.txt || { echo "FAIL: late CP1252 detection"; exit 1; }
          grep -q "TEST:late-utf8-encoding=UTF-8" tests/test-encoding-detect-out.txt || { echo "FAIL: late UTF-8 detection"; exit 1; }
          grep -q "TEST:hklatex-encoding=Windows-1252" tests/test-encoding-detect-out.txt || { echo "FAIL: hklatex detection"; exit 1; }
          grep -q "TEST:all-tests=complete" tests/test-encoding-detect-out.txt || { echo "FAIL: encoding detection test incomplete"; exit 1; }
      - name: Verify pview tests (ticket 11)
        run: |
          grep -q "TEST:pview-expanded-nested=yes" tests/test-pview-output.txt || { echo "FAIL: pview nested expansion"; exit 1; }
          grep -q "TEST:pview-git-unquote-ok=yes" tests/test-pview-output.txt || { echo "FAIL: pview git unquote"; exit 1; }
          grep -q "TEST:all-tests=complete" tests/test-pview-output.txt || { echo "FAIL: pview test incomplete"; exit 1; }
          grep -q "TEST:tool-loaded=1" tests/test-pview-toolbar-output.txt || { echo "FAIL: pview toolbar lazy load"; exit 1; }
          grep -q "TEST:mouse-ok=yes" tests/test-pview-toolbar-output.txt || { echo "FAIL: pview toolbar mouse"; exit 1; }
          grep -q "TEST:all-tests=complete" tests/test-pview-toolbar-output.txt || { echo "FAIL: pview toolbar test incomplete"; exit 1; }
      - name: Mouse-resize regression test (ticket 21)
        timeout-minutes: 5
        run: |
          python3 tests/mouse-resize-test.py src/.linuxgcc-release-mec/mec
      - name: Mouse-wheel regression test (ticket 22)
        timeout-minutes: 5
        run: |
          python3 tests/mouse-wheel-test.py src/.linuxgcc-release-mec/mec
      - name: Mouse-modifier regression test
        timeout-minutes: 5
        run: |
          python3 tests/mouse-mod-test.py src/.linuxgcc-release-mec/mec
      - name: Mouse middle-click paste regression test (ticket 25)
        timeout-minutes: 5
        run: |
          python3 tests/mouse-mid-test.py src/.linuxgcc-release-mec/mec
      - name: Modified cursor-key regression test (Alt/Ctrl/Shift arrows)
        timeout-minutes: 5
        run: |
          python3 tests/alt-cursor-test.py src/.linuxgcc-release-mec/mec

  macos:
    runs-on: macos-latest
    name: Test on macOS
    steps:
      - uses: actions/checkout@v6
      - name: Build mec (console)
        run: | 
            brew install xquartz
            brew install make
            brew install coreutils
            export PATH=/opt/homebrew/opt/make/libexec/gnubin:$PATH
            export PATH=/opt/homebrew/opt/coreutils/libexec/gnubin:$PATH
            export VRS=`grep -E '^#define me(YEAR|MONTH|DAY)' src/evers.h | awk '{ print $3 }' | paste -sd '' | sed 's/"//g'`
