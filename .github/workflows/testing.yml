name: Testing MicroEmacs basic features

on:
  workflow_dispatch:
  push:
    branches: [ master, msys-fix ]
  pull_request:
    branches: [ master ]

jobs:
  linux:
    runs-on: ubuntu-22.04
    name: Test on Linux
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libxt-dev
      - name: Build mec (console)
        run: make -f src/linux32gcc.gmk mec
      - name: Run basic tests
        run: |
          rm -f tests/test-output.txt
          MEPATH=jasspa/macros ./src/.linux32gcc-release-mec/mec @tests/test-basics 2>/dev/null || true
          cat tests/test-output.txt
      - name: Verify test results
        run: |
          if [ -s tests/test-output.txt ]; then
            echo "Tests produced output"
            grep -q "TEST:version=" tests/test-output.txt && echo "PASS: version test" || echo "FAIL: version test"
            grep -q "TEST:all-tests=complete" tests/test-output.txt && echo "PASS: all tests completed" || echo "FAIL: all tests did not complete"
          else
            echo "FAIL: No test output produced"
            exit 1
          fi
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-linux
          path: tests/test-output.txt

  macos:
    runs-on: macos-latest
    name: Test on macOS
    steps:
      - uses: actions/checkout@v4
      - name: Build mec (console)
        run: make -f src/darwin.gmk mec
      - name: Run basic tests
        run: |
          rm -f tests/test-output.txt
          MEPATH=jasspa/macros ./src/.darwin-release-mec/mec @tests/test-basics 2>/dev/null || true
          cat tests/test-output.txt
      - name: Verify test results
        run: |
          if [ -s tests/test-output.txt ]; then
            echo "Tests produced output"
            grep -q "TEST:version=" tests/test-output.txt && echo "PASS: version test" || echo "FAIL: version test"
            grep -q "TEST:all-tests=complete" tests/test-output.txt && echo "PASS: all tests completed" || echo "FAIL: all tests did not complete"
          else
            echo "FAIL: No test output produced"
            exit 1
          fi
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-macos
          path: tests/test-output.txt

  windows-mingw:
    runs-on: windows-latest
    name: Test on Windows (MinGW64)
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          install: mingw-w64-x86_64-gcc make
      - name: Build mec (console)
        shell: msys2 {0}
        run: |
          cd src
          make -f winmingwgcc.mak BTYP=c all
      - name: Run basic tests
        shell: msys2 {0}
        run: |
          rm -f tests/test-output.txt
          MEPATH=jasspa/macros src/.mingw64gcc-release-mec/mec32.exe @tests/test-basics 2>/dev/null || true
          cat tests/test-output.txt
      - name: Verify test results
        shell: msys2 {0}
        run: |
          if [ -s tests/test-output.txt ]; then
            echo "Tests produced output"
            grep -q "TEST:version=" tests/test-output.txt && echo "PASS: version test" || echo "FAIL: version test"
            grep -q "TEST:all-tests=complete" tests/test-output.txt && echo "PASS: all tests completed" || echo "FAIL: all tests did not complete"
          else
            echo "FAIL: No test output produced"
            exit 1
          fi
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-windows-mingw
          path: tests/test-output.txt

  windows-msys2:
    runs-on: windows-latest
    name: Test on Windows (MSYS2)
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: msys
          install: gcc make
      - name: Build mec (console)
        shell: msys2 {0}
        run: |
          cd src
          make -f winmingwgcc.mak BTYP=c all
      - name: Run basic tests
        shell: msys2 {0}
        run: |
          rm -f tests/test-output.txt
          MEPATH=jasspa/macros src/.msys64gcc-release-mec/mec32.exe @tests/test-basics 2>/dev/null || true
          cat tests/test-output.txt
      - name: Verify test results
        shell: msys2 {0}
        run: |
          if [ -s tests/test-output.txt ]; then
            echo "Tests produced output"
            grep -q "TEST:version=" tests/test-output.txt && echo "PASS: version test" || echo "FAIL: version test"
            grep -q "TEST:all-tests=complete" tests/test-output.txt && echo "PASS: all tests completed" || echo "FAIL: all tests did not complete"
          else
            echo "FAIL: No test output produced"
            exit 1
          fi
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-windows-msys2
          path: tests/test-output.txt

  cygwin:
    runs-on: windows-latest
    name: Test on Cygwin
    steps:
      - uses: actions/checkout@v4
      - name: Build mec (console)
        shell: cygwin {0}
        run: |
          cd src
          make -f cygwin.gmk mec
      - name: Run basic tests
        shell: cygwin {0}
        run: |
          rm -f tests/test-output.txt
          MEPATH=jasspa/macros ./src/.cygwin-release-mec/mec.exe @tests/test-basics 2>/dev/null || true
          cat tests/test-output.txt
      - name: Verify test results
        shell: cygwin {0}
        run: |
          if [ -s tests/test-output.txt ]; then
            echo "Tests produced output"
            grep -q "TEST:version=" tests/test-output.txt && echo "PASS: version test" || echo "FAIL: version test"
            grep -q "TEST:all-tests=complete" tests/test-output.txt && echo "PASS: all tests completed" || echo "FAIL: all tests did not complete"
          else
            echo "FAIL: No test output produced"
            exit 1
          fi
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-cygwin
          path: tests/test-output.txt
