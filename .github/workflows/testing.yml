name: Testing MicroEmacs basic features

on:
  workflow_dispatch:
  push:
    branches: [ master, msys-fix ]
  pull_request:
    branches: [ master ]

jobs:
  linux:
    runs-on: ubuntu-22.04
    name: Test on Linux
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libxt-dev
      - name: Build mec (console)
        run: make -f linux32gcc.gmk mec
      - name: Run basic tests
        run: |
          #rm -f tests/test-output.txt
          echo "VRS=$VRS" >> $GITHUB_ENV
          export TERM=xterm
          MEPATH=jasspa/macros ./src/.linux32gcc-release-mec/mec @tests/test-basics 2>/dev/null || true
          cat tests/test-output.txt
      - name: Verify test results
        run: |
          if [ -s tests/test-output.txt ]; then
            echo "Tests produced output"
            grep -q "TEST:version=" tests/test-output.txt && echo "PASS: version test" || echo "FAIL: version test"
            grep -q "TEST:all-tests=complete" tests/test-output.txt && echo "PASS: all tests completed" || echo "FAIL: all tests did not complete"
          else
            echo "FAIL: No test output produced"
            exit 1
          fi
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-linux
          path: tests/test-output.txt

  macos:
    runs-on: macos-latest
    name: Test on macOS
    steps:
      - uses: actions/checkout@v4
      - name: Build mec (console)
        run: | 
            brew install xquartz
            brew install make
            brew install coreutils
            export PATH=/opt/homebrew/opt/make/libexec/gnubin:$PATH
            export PATH=/opt/homebrew/opt/coreutils/libexec/gnubin:$PATH
            export VRS=`grep -E '^#define me(YEAR|MONTH|DAY)' src/evers.h | awk '{ print $3 }' | paste -sd '' | sed 's/"//g'`
            echo "VRS=$VRS" >> $GITHUB_ENV
            echo "GCC=gcc-15" >> $GITHUB_ENV
            make -f macos32gcc.gmk mec CC=gcc-15
      - name: Run basic tests
        run: |
          #rm -f tests/test-output.txt
          export TERM=xterm
          MEPATH=jasspa/macros ./src/.macos32gcc-release-mec/mec @tests/test-basics 2>/dev/null || true
          cat tests/test-output.txt
      - name: Verify test results
        run: |
          if [ -s tests/test-output.txt ]; then
            echo "Tests produced output"
            grep -q "TEST:version=" tests/test-output.txt && echo "PASS: version test" || echo "FAIL: version test"
            grep -q "TEST:all-tests=complete" tests/test-output.txt && echo "PASS: all tests completed" || echo "FAIL: all tests did not complete"
          else
            echo "FAIL: No test output produced"
            exit 1
          fi
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-macos
          path: tests/test-output.txt

  windows-mingw:
    runs-on: windows-latest
    name: Test on Windows (MinGW64)
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          install: mingw-w64-x86_64-gcc make
      - name: Build mec (console)
        shell: msys2 {0}
        run: |
          cd src
          make -f winmingwgcc.mak BTYP=c all BDIST=mingw64
      - name: Run basic tests
        shell: msys2 {0}
        run: |
          ls src/
          MEPATH=jasspa/macros src/.mingw64win-release-mec/mec32.exe @tests/test-basics 2>/dev/null || true
          cat tests/test-output.txt
      - name: Verify test results
        shell: msys2 {0}
        run: |
          if [ -s tests/test-output.txt ]; then
            echo "Tests produced output"
            grep -q "TEST:version=" tests/test-output.txt && echo "PASS: version test" || echo "FAIL: version test"
            grep -q "TEST:all-tests=complete" tests/test-output.txt && echo "PASS: all tests completed" || echo "FAIL: all tests did not complete"
          else
            echo "FAIL: No test output produced"
            exit 1
          fi
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-windows-mingw
          path: tests/test-output.txt

  cygwin-x64:
    runs-on: windows-latest
    name: Test on Cygwin (x86_64)
    steps:
      - uses: actions/checkout@v4
      - name: Install Cygwin
        uses: cygwin/cygwin-install-action@v6
        with:
          packages: |
            make
            gcc-core
            zlib-devel
            libXt-devel
            libncurses-devel
          install-dir: C:\cygwin
          platform: x86_64
      - name: Build mec (console)
        shell: C:\cygwin\bin\bash.exe --login --norc -eo pipefail -o igncr '{0}'
        run: |
          cd $GITHUB_WORKSPACE/src
          make -f cygwin.gmk mec
      - name: Run basic tests
        shell: C:\cygwin\bin\bash.exe --login --norc -eo pipefail -o igncr '{0}'
        run: |
          cd $GITHUB_WORKSPACE
          MEPATH=jasspa/macros ./src/mec.exe @tests/test-basics 2>/dev/null || true
          cat tests/test-output.txt
      - name: Verify test results
        shell: C:\cygwin\bin\bash.exe --login --norc -eo pipefail -o igncr '{0}'
        run: |
          cd $GITHUB_WORKSPACE
          if [ -s tests/test-output.txt ]; then
            echo "Tests produced output"
            grep -q "TEST:version=" tests/test-output.txt && echo "PASS: version test" || echo "FAIL: version test"
            grep -q "TEST:all-tests=complete" tests/test-output.txt && echo "PASS: all tests completed" || echo "FAIL: all tests did not complete"
          else
            echo "FAIL: No test output produced"
            exit 1
          fi
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-cygwin-x64
          path: tests/test-output.txt

  cygwin-x86:
    runs-on: windows-latest
    name: Test on Cygwin (x86)
    steps:
      - uses: actions/checkout@v4
      - name: Install Cygwin
        uses: cygwin/cygwin-install-action@v6
        with:
          packages: |
            make
            gcc-core
            zlib-devel
            libXt-devel
            libncurses-devel
          install-dir: C:\cygwin
          platform: x86
      - name: Build mec (console)
        shell: C:\cygwin\bin\bash.exe --login --norc -eo pipefail -o igncr '{0}'
        run: |
          cd $GITHUB_WORKSPACE/src
          make -f cygwin.gmk mec
      - name: Run basic tests
        shell: C:\cygwin\bin\bash.exe --login --norc -eo pipefail -o igncr '{0}'
        run: |
          cd $GITHUB_WORKSPACE
          export TERM=xterm
          MEPATH=jasspa/macros ./src/mec.exe @tests/test-basics 2>/dev/null || true
          cat tests/test-output.txt
      - name: Verify test results
        shell: C:\cygwin\bin\bash.exe --login --norc -eo pipefail -o igncr '{0}'
        run: |
          cd $GITHUB_WORKSPACE
          if [ -s tests/test-output.txt ]; then
            echo "Tests produced output"
            grep -q "TEST:version=" tests/test-output.txt && echo "PASS: version test" || echo "FAIL: version test"
            grep -q "TEST:all-tests=complete" tests/test-output.txt && echo "PASS: all tests completed" || echo "FAIL: all tests did not complete"
          else
            echo "FAIL: No test output produced"
            exit 1
          fi
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-cygwin-x86
          path: tests/test-output.txt
