name: Testing MicroEmacs basic features

on:
  workflow_dispatch:
  push:
    branches: [ devel ]

jobs:
  linux:
    runs-on: ubuntu-22.04
    name: Test on Linux
    steps:
      - uses: actions/checkout@v6
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libxt-dev
      - name: Build mec (console)
        run: make -f makefiles/unixgcc.gmk mec
      - name: Run basic tests
        run: |
          #rm -f tests/test-output.txt
          echo "VRS=$VRS" >> $GITHUB_ENV
          export TERM=xterm
          MEPATH=jasspa/macros ./src/.linuxgcc-release-mec/mec @tests/test-basics 2>/dev/null || true
          cat tests/test-output.txt
      - name: Verify test results
        run: |
          if [ -s tests/test-output.txt ]; then
            echo "Tests produced output"
            grep -q "TEST:version=" tests/test-output.txt && echo "PASS: version test" || echo "FAIL: version test"
            grep -q "TEST:all-tests=complete" tests/test-output.txt && echo "PASS: all tests completed" || echo "FAIL: all tests did not complete"
            grep -q "TEST:nested-while=64" tests/test-output.txt && echo "PASS: nested while test" || { echo "FAIL: nested while test"; exit 1; }
            grep -q "TEST:unicode=αβγ" tests/test-output.txt && echo "PASS: unicode test" || { echo "FAIL: unicode test"; exit 1; }
            grep -q "TEST:utf8-strfuncs=ok" tests/test-output.txt && echo "PASS: utf8 string functions test" || { echo "FAIL: utf8 string functions test"; exit 1; }
          else
            echo "FAIL: No test output produced"
            exit 1
          fi
      - name: Upload test results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-results-linux
          path: tests/test-output.txt

  macos:
    runs-on: macos-latest
    name: Test on macOS
    steps:
      - uses: actions/checkout@v6
      - name: Build mec (console)
        run: | 
            brew install xquartz
            brew install make
            brew install coreutils
            export PATH=/opt/homebrew/opt/make/libexec/gnubin:$PATH
            export PATH=/opt/homebrew/opt/coreutils/libexec/gnubin:$PATH
            export VRS=`grep -E '^#define me(YEAR|MONTH|DAY)' src/evers.h | awk '{ print $3 }' | paste -sd '' | sed 's/"//g'`
            echo "VRS=$VRS" >> $GITHUB_ENV
            echo "GCC=gcc-15" >> $GITHUB_ENV
            make -f makefiles/macosgcc.gmk mec CC=gcc-15
      - name: Run basic tests
        run: |
          #rm -f tests/test-output.txt
          export TERM=xterm
          MEPATH=jasspa/macros ./src/.macosgcc-release-mec/mec @tests/test-basics 2>/dev/null || true
          cat tests/test-output.txt
      - name: Verify test results
        run: |
          if [ -s tests/test-output.txt ]; then
            echo "Tests produced output"
            grep -q "TEST:version=" tests/test-output.txt && echo "PASS: version test" || echo "FAIL: version test"
            grep -q "TEST:all-tests=complete" tests/test-output.txt && echo "PASS: all tests completed" || echo "FAIL: all tests did not complete"
            grep -q "TEST:nested-while=64" tests/test-output.txt && echo "PASS: nested while test" || { echo "FAIL: nested while test"; exit 1; }
            grep -q "TEST:unicode=αβγ" tests/test-output.txt && echo "PASS: unicode test" || { echo "FAIL: unicode test"; exit 1; }
            grep -q "TEST:utf8-strfuncs=ok" tests/test-output.txt && echo "PASS: utf8 string functions test" || { echo "FAIL: utf8 string functions test"; exit 1; }
          else
            echo "FAIL: No test output produced"
            exit 1
          fi
      - name: Upload test results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-results-macos
          path: tests/test-output.txt

  windows-ucrt64:
    runs-on: windows-latest
    name: Test on Windows (UCRT64)
    steps:
      - uses: actions/checkout@v6
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ucrt64
          install: mingw-w64-x86_64-gcc make
      - name: Build mec (console)
        shell: msys2 {0}
        run: |
          cd src
          make -f winmingwgcc.mak BTYP=c all BDIST=mingw64
      - name: Run basic tests
        shell: msys2 {0}
        run: |
          ls src/
          MEPATH=jasspa/macros src/.ucrt64win-release-mec/mec.exe @tests/test-basics 2>/dev/null || true
          cat tests/test-output.txt
      - name: Verify test results
        shell: msys2 {0}
        run: |
          if [ -s tests/test-output.txt ]; then
            echo "Tests produced output"
            grep -q "TEST:version=" tests/test-output.txt && echo "PASS: version test" || echo "FAIL: version test"
            grep -q "TEST:all-tests=complete" tests/test-output.txt && echo "PASS: all tests completed" || echo "FAIL: all tests did not complete"
            grep -q "TEST:nested-while=64" tests/test-output.txt && echo "PASS: nested while test" || { echo "FAIL: nested while test"; exit 1; }
            grep -q "TEST:unicode=αβγ" tests/test-output.txt && echo "PASS: unicode test" || { echo "FAIL: unicode test"; exit 1; }
            grep -q "TEST:utf8-strfuncs=ok" tests/test-output.txt && echo "PASS: utf8 string functions test" || { echo "FAIL: utf8 string functions test"; exit 1; }
          else
            echo "FAIL: No test output produced"
            exit 1
          fi
      - name: Upload test results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-results-windows-mingw
          path: tests/test-output.txt

  windows-msysunix:
    runs-on: windows-latest
    name: Test on Windows (MSYS2 mintty)
    steps:
      - uses: actions/checkout@v6
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ucrt64
          install: make
      - name: Install MSYS packages
        shell: msys2 {0}
        run: |
          pacman -S --noconfirm gcc ncurses ncurses-devel zlib zlib-devel util-linux
      - name: Build mec (console, msys2unix)
        shell: msys2 {0}
        run: |
          cd src
          make -f winmingwgcc.mak print-info
          make -f winmingwgcc.mak BTYP=c all BDIST=msys2unix
      - name: Run basic tests
        timeout-minutes: 10
        shell: msys2 {0}
        run: |
          ls src/
          export TERM=xterm
          script -q -c "MEPATH=jasspa/macros src/.ucrt64unix-release-mec/mec.exe @tests/test-basics" /dev/null 2>/dev/null || true
          cat tests/test-output.txt
      - name: Verify test results
        shell: msys2 {0}
        run: |
          if [ -s tests/test-output.txt ]; then
            echo "Tests produced output"
            grep -q "TEST:version=" tests/test-output.txt && echo "PASS: version test" || echo "FAIL: version test"
            grep -q "TEST:all-tests=complete" tests/test-output.txt && echo "PASS: all tests completed" || echo "FAIL: all tests did not complete"
            grep -q "TEST:nested-while=64" tests/test-output.txt && echo "PASS: nested while test" || { echo "FAIL: nested while test"; exit 1; }
            grep -q "TEST:unicode=αβγ" tests/test-output.txt && echo "PASS: unicode test" || { echo "FAIL: unicode test"; exit 1; }
            grep -q "TEST:utf8-strfuncs=ok" tests/test-output.txt && echo "PASS: utf8 string functions test" || { echo "FAIL: utf8 string functions test"; exit 1; }
          else
            echo "FAIL: No test output produced"
            exit 1
          fi
      - name: Upload test results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-results-msysunix
          path: tests/test-output.txt

  cygwin-x64:
    runs-on: windows-latest
    name: Test on Cygwin (x86_64)
    steps:
      - uses: actions/checkout@v6
      - name: Install Cygwin
        uses: cygwin/cygwin-install-action@v6
        with:
          packages: |
            make
            gcc-core
            zlib-devel
            libXt-devel
            libncurses-devel
            util-linux
          install-dir: C:\cygwin
          platform: x86_64
      - name: Build mec (console)
        shell: C:\cygwin\bin\bash.exe --login --norc -eo pipefail -o igncr '{0}'
        run: |
          cd $GITHUB_WORKSPACE/src
          make -f unixgcc.gmk mec
      - name: Run basic tests
        shell: C:\cygwin\bin\bash.exe --login --norc -eo pipefail -o igncr '{0}'
        run: |
          cd $GITHUB_WORKSPACE
          script -q -c "MEPATH=jasspa/macros ./src/.cygwin-release-mec/mec.exe @tests/test-basics" /dev/null 2>/dev/null || true
          cat tests/test-output.txt
      - name: Verify test results
        shell: C:\cygwin\bin\bash.exe --login --norc -eo pipefail -o igncr '{0}'
        run: |
          cd $GITHUB_WORKSPACE
          if [ -s tests/test-output.txt ]; then
            echo "Tests produced output"
            grep -q "TEST:version=" tests/test-output.txt && echo "PASS: version test" || echo "FAIL: version test"
            grep -q "TEST:all-tests=complete" tests/test-output.txt && echo "PASS: all tests completed" || echo "FAIL: all tests did not complete"
            grep -q "TEST:nested-while=64" tests/test-output.txt && echo "PASS: nested while test" || { echo "FAIL: nested while test"; exit 1; }
            grep -q "TEST:unicode=αβγ" tests/test-output.txt && echo "PASS: unicode test" || { echo "FAIL: unicode test"; exit 1; }
            grep -q "TEST:utf8-strfuncs=ok" tests/test-output.txt && echo "PASS: utf8 string functions test" || { echo "FAIL: utf8 string functions test"; exit 1; }
          else
            echo "FAIL: No test output produced"
            exit 1
          fi
      - name: Upload test results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-results-cygwin-x64
          path: tests/test-output.txt

  cygwin-x86:
    runs-on: windows-latest
    name: Test on Cygwin (x86)
    steps:
      - uses: actions/checkout@v6
      - name: Install Cygwin
        uses: cygwin/cygwin-install-action@v6
        with:
          packages: |
            make
            gcc-core
            zlib-devel
            libXt-devel
            libncurses-devel
            util-linux
          install-dir: C:\cygwin
          platform: x86
      - name: Build mec (console)
        shell: C:\cygwin\bin\bash.exe --login --norc -eo pipefail -o igncr '{0}'
        run: |
          cd $GITHUB_WORKSPACE/src
          make -f unixgcc.gmk mec
      - name: Run basic tests
        shell: C:\cygwin\bin\bash.exe --login --norc -eo pipefail -o igncr '{0}'
        run: |
          cd $GITHUB_WORKSPACE
          script -q -c "MEPATH=jasspa/macros ./src/.cygwin-release-mec/mec.exe @tests/test-basics" /dev/null 2>/dev/null || true
          cat tests/test-output.txt
      - name: Verify test results
        shell: C:\cygwin\bin\bash.exe --login --norc -eo pipefail -o igncr '{0}'
        run: |
          cd $GITHUB_WORKSPACE
          if [ -s tests/test-output.txt ]; then
            echo "Tests produced output"
            grep -q "TEST:version=" tests/test-output.txt && echo "PASS: version test" || echo "FAIL: version test"
            grep -q "TEST:all-tests=complete" tests/test-output.txt && echo "PASS: all tests completed" || echo "FAIL: all tests did not complete"
            grep -q "TEST:nested-while=64" tests/test-output.txt && echo "PASS: nested while test" || { echo "FAIL: nested while test"; exit 1; }
            grep -q "TEST:unicode=αβγ" tests/test-output.txt && echo "PASS: unicode test" || { echo "FAIL: unicode test"; exit 1; }
            grep -q "TEST:utf8-strfuncs=ok" tests/test-output.txt && echo "PASS: utf8 string functions test" || { echo "FAIL: utf8 string functions test"; exit 1; }
          else
            echo "FAIL: No test output produced"
            exit 1
          fi
      - name: Upload test results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-results-cygwin-x86
          path: tests/test-output.txt

  windows-winlibs:
    runs-on: windows-2022
    name: Test on Windows (WinLibs)
    steps:
      - uses: actions/checkout@v6
      - name: Download winlibs
        shell: cmd
        run: |
          curl -OL https://github.com/brechtsanders/winlibs_mingw/releases/download/12.2.0-16.0.0-10.0.0-ucrt-r5/winlibs-i686-posix-dwarf-gcc-12.2.0-mingw-w64ucrt-10.0.0-r5.zip
          unzip -q winlibs-i686-posix-dwarf-gcc-12.2.0-mingw-w64ucrt-10.0.0-r5.zip
          echo %CD%\mingw32\bin>>%GITHUB_PATH%
      - name: Build mec (console)
        shell: cmd
        run: |
          gcc --version
          mingw32-make -f makefiles/win32winlibs.gmk mec
      - name: Run basic tests
        shell: cmd
        run: |
          set MEPATH=jasspa\macros
          src\.win32winlibs-release-mec\mec.exe @tests\test-basics
          type tests\test-output.txt
      - name: Verify test results
        shell: cmd
        run: |
          if exist tests\test-output.txt (
            echo Tests produced output
            findstr /C:"TEST:version=" tests\test-output.txt >nul && echo PASS: version test || echo FAIL: version test
            findstr /C:"TEST:all-tests=complete" tests\test-output.txt >nul && echo PASS: all tests completed || echo FAIL: all tests did not complete
            findstr /C:"TEST:nested-while=64" tests\test-output.txt >nul && echo PASS: nested while test || (echo FAIL: nested while test & exit /b 1)
            findstr /C:"TEST:unicode=" tests\test-output.txt >nul && echo PASS: unicode test || (echo FAIL: unicode test & exit /b 1)
            findstr /C:"TEST:utf8-strfuncs=ok" tests\test-output.txt >nul && echo PASS: utf8 string functions test || (echo FAIL: utf8 string functions test & exit /b 1)
          ) else (
            echo FAIL: No test output produced
            exit /b 1
          )
      - name: Upload test results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-results-windows-winlibs
          path: tests/test-output.txt
