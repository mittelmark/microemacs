name: Binaries Windows (windows-cygwin)

on:
  workflow_dispatch:
env:
   VERSION: "091226b1"
jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x86_64, x86]    
    steps:
    # Default checkout: clones exactly the ref the workflow was dispatched on
    # (branch selected for the run), no git clone inside Cygwin needed anymore
    # (avoids certificate errors of a fresh Cygwin git).
    - uses: actions/checkout@v6
    - name: Install Cygwin
      uses: cygwin/cygwin-install-action@v6
      with:
        packages: |
          git
          bash 
          make 
          gcc-core 
          wget 
          zlib-devel 
          libncurses-devel 
          libXt-devel
          libXft-devel
          pkg-config
          freetype
          fontconfig 
          zip 
          unzip
        install-dir: C:\cygwin
        platform: ${{ matrix.arch }}
    - name: Modify PATH
      run: |
        echo "C:\cygwin\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        
    - name: Verify Cygwin installation
      shell: C:\cygwin\bin\bash.exe --login --norc -eo pipefail -o igncr '{0}'
      run: |
        echo $PATH
        which bash
        bash --version

    - name: Run your commands
      shell: C:\cygwin\bin\bash.exe --login --norc -eo pipefail -o igncr '{0}'
      run: |
        # Your Cygwin commands here
        cygcheck -c
        make --version
        gcc --version
        
    - name: Install apt-cyg
      shell: C:\cygwin\bin\bash.exe --login --norc -eo pipefail -o igncr '{0}'
      run: |
        wget https://raw.githubusercontent.com/transcode-open/apt-cyg/master/apt-cyg
        install apt-cyg /bin
        chmod +x /bin/apt-cyg
        
    - name: Verify Python Installation
      shell: C:\cygwin\bin\bash.exe --login --norc -eo pipefail -o igncr '{0}'
      run: |
        python3 --version
        which python3

    - name: Capture Cygwin Version
      shell: C:\cygwin\bin\bash.exe --login --norc -eo pipefail -o igncr '{0}'
      run: |
        CYGWIN_VER=$(uname -r | grep -oE '^[0-9]\.[0-9]+')
        echo "CYGWIN_VER=$CYGWIN_VER" >> $GITHUB_ENV
        echo "Cygwin version: $CYGWIN_VER"
        CYGWIN_MACHINE=$(uname -m)
        echo "CYGWIN_MACHINE=$CYGWIN_MACHINE" >> $GITHUB_ENV
        echo "Cygwin Machine: $CYGWIN_MACHINE"

    - name: Build MicroEmacs
      shell: C:\cygwin\bin\bash.exe --login --norc -eo pipefail -o igncr '{0}'
      run: |
        # the repository was checked out before by actions/checkout,
        # the working directory contains the branch selected for this run
        cd $GITHUB_WORKSPACE
        pwd
        echo "Checked out ref: $GITHUB_REF_NAME ($GITHUB_SHA)"
        git log -1 --oneline || echo "(git log not available, continuing)"
        export VRS=`grep -E '^#define me(YEAR|MONTH|DAY)' src/evers.h | awk '{ print $3 }' | paste -sd '' | sed 's/"//g'`
        echo "VRS=$VRS" >> $GITHUB_ENV
        echo "VRS=$VRS"
        make -f makefiles/unixgcc.gmk default
        pkg-config --exists xft && echo "XFT: found" || echo "XFT: missing"
        make -f makefiles/unixgcc.gmk bfs/bin
        make -f makefiles/unixgcc.gmk mec  
        make -f makefiles/unixgcc.gmk mecb
        make -f makefiles/unixgcc.gmk mew  mewb        
        make -f makefiles/unixgcc.gmk mecw mecwb                
        ls
        ls -l ./cygwin-${CYGWIN_VER}-${CYGWIN_MACHINE}-microemacs-${VRS}-mecb.exe
        echo `./cygwin-${CYGWIN_VER}-${CYGWIN_MACHINE}-microemacs-${VRS}-mecb.exe -V`
        pwd
        make -f makefiles/unixgcc.gmk release app=mecb
        
    - name: Cygwin Combined Release 
      shell: C:\cygwin\bin\bash.exe --login --norc -eo pipefail -o igncr '{0}'    
      run: |
        cd $GITHUB_WORKSPACE
        make -f makefiles/unixgcc.gmk release app=mecb
        make -f makefiles/unixgcc.gmk release app=mewb        
        make -f makefiles/unixgcc.gmk release app=mecwb
        find . -name "*.exe" | xargs rm
                        

    - name: Upload Cygwin Combined Release
      uses: actions/upload-artifact@v6
      with: 
        name: Release-cygwin-${{ env.CYGWIN_VER }}-${{ env.CYGWIN_MACHINE }}-windows
        path: ${{ github.workspace }}/cygwin-*
        
