name: Ubuntu 22,24 checks (linux-gcc)

on:
  workflow_dispatch:
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-22.04-arm, ubuntu-24.04-arm]  # Specify the Ubuntu version

    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
     
    - name: developer library installs
      run: |
        sudo apt install build-essential
        #sudo apt install desktop-file-utils
        sudo apt install libxt-dev
        export VRS=`awk '/^.define meRELEASE/ { gsub(/"/,"",$3); print $3 }' src/evers.h`
        echo "VRS=$VRS" >> $GITHUB_ENV
        echo "uname -r"
        uname -r
        echo "uname -o"
        uname -o
        echo "uname -m"
        uname -m
