name: Binaries Windows (linux-mingw-gcc)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { bdist: mingw64, arch: x64,  label: mingw64 }
          - { bdist: mingw32, arch: x86,   label: mingw32 }
          # ucrt64 support not available on Ubuntu only on Debain
          #- { bdist: ucrt64,  arch: x64-ucrt, label: ucrt64 }
    name: Build ${{ matrix.label }} (${{ matrix.arch }})

    steps:
    - uses: actions/checkout@v6

    - name: Install cross-compile toolchain
      run: |
        sudo apt install build-essential mingw-w64 gcc-mingw-w64-i686
        sudo apt install libz-mingw-w64 libz-mingw-w64-dev
        sudo apt install desktop-file-utils

    - name: Detect version
      run: |
        export VRS=`grep -E '^.define me(YEAR|MONTH|DAY)' src/evers.h | awk '{ print $3 }' | paste -sd '' | sed 's/"//g'`
        echo "VRS=$VRS" >> $GITHUB_ENV
        echo "BDIST=${{ matrix.bdist }}" >> $GITHUB_ENV

    - name: Build bfs binary
      run: make -f makefiles/linuxmingwgcc.gmk BDIST=${{ matrix.bdist }} bfs/bin

    - name: Build mec binary
      run: make -f makefiles/linuxmingwgcc.gmk BDIST=${{ matrix.bdist }} mec

    - name: Build mew binary
      run: make -f makefiles/linuxmingwgcc.gmk BDIST=${{ matrix.bdist }} mew

    - name: Build mecb bundle
      run: make -f makefiles/linuxmingwgcc.gmk BDIST=${{ matrix.bdist }} mecb

    - name: Build mewb bundle
      run: make -f makefiles/linuxmingwgcc.gmk BDIST=${{ matrix.bdist }} mewb

    - name: Create release package
      run: |
        make -f makefiles/linuxmingwgcc.gmk BDIST=${{ matrix.bdist }} release app=mecb
        make -f makefiles/linuxmingwgcc.gmk BDIST=${{ matrix.bdist }} release app=mewb

    # Cross-compiled Windows binaries cannot be executed on the Linux runner,
    # so only verify they are real PE executables (not empty/broken output).
    - name: Verify binaries are Windows PE executables
      run: |
        for f in *-mecb.exe *-mewb.exe; do
          echo "== $f"
          file "$f" | grep -q 'PE32' || { echo "not a PE executable: $f" >&2; exit 1; }
        done

    - name: Create brew package
      run: |
        make -f makefiles/linuxmingwgcc.gmk BDIST=${{ matrix.bdist }} brew
        mkdir -p brew-${{ matrix.label }}-${{ env.VRS }}
        cp -r brew-windows-*/* brew-${{ matrix.label }}-${{ env.VRS }}/
        zip -r brew-${{ matrix.label }}-${{ env.VRS }}.zip brew-${{ matrix.label }}-${{ env.VRS }}/*
        sha256sum brew-${{ matrix.label }}-${{ env.VRS }}.zip > brew-${{ matrix.label }}-${{ env.VRS }}.sha256

    - name: Create scoop package
      run: |
        make -f makefiles/linuxmingwgcc.gmk BDIST=${{ matrix.bdist }} scoop
        mkdir -p scoop-${{ matrix.label }}-${{ env.VRS }}
        cp -r mecw-scoop-*/* scoop-${{ matrix.label }}-${{ env.VRS }}/
        zip -r scoop-${{ matrix.label }}-${{ env.VRS }}.zip scoop-${{ matrix.label }}-${{ env.VRS }}/*
        sha256sum scoop-${{ matrix.label }}-${{ env.VRS }}.zip > scoop-${{ matrix.label }}-${{ env.VRS }}.sha256

    - name: Upload ${{ matrix.label }} mecb
      uses: actions/upload-artifact@v6
      with:
        name: windows-${{ matrix.label }}-mecb-${{ env.VRS }}
        path: windows-${{ matrix.label }}-*-mecb.exe

    - name: Upload ${{ matrix.label }} mewb
      uses: actions/upload-artifact@v6
      with:
        name: windows-${{ matrix.label }}-mewb-${{ env.VRS }}
        path: windows-${{ matrix.label }}-*-mewb.exe

    - name: Test release checksums
      run: |
        ls -l windows-${{ matrix.label }}-*/ || true
        ## each packaging run must have produced non-empty archives and the
        ## sha256 checksum file written by makefiles/release.gmk
        for d in windows-${{ matrix.label }}-*/; do
          d="${d%/}"
          test -s "${d}/${d}.sha256" || { echo "missing checksum: ${d}/${d}.sha256"; exit 1; }
          for z in "${d}"/*.zip; do
            test -s "${z}" || { echo "empty artifact: ${z}"; exit 1; }
          done
          ( cd "${d}" && sha256sum -c "${d}.sha256" )
        done

    - name: Upload ${{ matrix.label }} combined release
      uses: actions/upload-artifact@v6
      with:
        name: Release-windows-${{ matrix.label }}-${{ env.VRS }}
        path: windows-${{ matrix.label }}-*/

    - name: Upload ${{ matrix.label }} brew package
      uses: actions/upload-artifact@v6
      with:
        name: brew-${{ matrix.label }}-${{ env.VRS }}
        path: brew-${{ matrix.label }}-${{ env.VRS }}.zip

    - name: Upload ${{ matrix.label }} scoop package
      uses: actions/upload-artifact@v6
      with:
        name: scoop-${{ matrix.label }}-${{ env.VRS }}
        path: scoop-${{ matrix.label }}-${{ env.VRS }}.zip
