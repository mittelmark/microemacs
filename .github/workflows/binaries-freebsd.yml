name: Binaries FreeBSD (amd64)

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    name: A job to run test in FreeBSD
    env:
      MYTOKEN : ${{ secrets.MYTOKEN }}
      MYTOKEN2: "value2"
    steps:
    - uses: actions/checkout@v7
    - name: Test in FreeBSD
      id: test
      uses: vmactions/freebsd-vm@v1
      with:
        envs: 'MYTOKEN MYTOKEN2'
        prepare: |
          

        run: |
          pkg install -y curl
          pwd
          ls -lah
          whoami
          env
          freebsd-version
          uname -a
          sysctl hw.ncpu
          sysctl hw.physmem
          sysctl hw.usermem
          echo hello > hello.txt
          
    - name: Test files
      run:  |
         uname -a
         ls -lah
    
