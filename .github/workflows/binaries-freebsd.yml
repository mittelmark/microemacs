name: Binaries FreeBSD (freebsd-gcc)

on: 
 workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        freebsd: ["14", "15"]   # Specify the FreeBSD release
    runs-on: ubuntu-latest
    name: Build in FreeBSD ${{ matrix.freebsd }}
    env:
      MYTOKEN : ${{ secrets.MYTOKEN }}
      MYTOKEN2: "value2"
    steps:
    - uses: actions/checkout@v7
    - name: Test in FreeBSD
      id: test
      uses: vmactions/freebsd-vm@v1
      with:
        release: ${{ matrix.freebsd }}
        envs: 'MYTOKEN MYTOKEN2'
        prepare: |
          

        run: |
          pkg install -y curl gcc gmake libXt libX11 libXft pkgconf fontconfig zip
          pwd
          ls -lah
          whoami
          env
          freebsd-version
          uname -a
          sysctl hw.ncpu
          sysctl hw.physmem
          sysctl hw.usermem
          echo hello > hello.txt
          make -f makefiles/freebsd.mak bfs/bin
          make -f makefiles/freebsd.mak mec mew mecw
          make -f makefiles/freebsd.mak mecb mewb mecwb
          make release app=mecb
          make release app=mewb
          make release app=mecwb
          ## smoke test: the standalone mecb must run and report its version
          for b in *-mecb.bin; do echo "== $b"; ./$b -V; done
          
    - name: Test files
      run:  |
         uname -a
         ls -lah
         export VRS=`grep -E '^#define me(YEAR|MONTH|DAY)' src/evers.h | awk '{ print $3 }' | paste -sd '' | sed 's/"//g'`
         echo "VRS=$VRS" >> $GITHUB_ENV

    - name: Test release checksums
      run:  |
         ls -l freebsd-*/ || true
         ## each packaging run must have produced non-empty archives and the
         ## sha256 checksum file written by makefiles/release.gmk
         for d in freebsd-*/; do
           d="${d%/}"
           test -s "${d}/${d}.sha256" || { echo "missing checksum: ${d}/${d}.sha256"; exit 1; }
           for z in "${d}"/*.zip; do
             test -s "${z}" || { echo "empty artifact: ${z}"; exit 1; }
           done
           ( cd "${d}" && sha256sum -c "${d}.sha256" )
         done

    - name: Upload FreeBSD Combined Release
      uses: actions/upload-artifact@v6
      with: 
        name: Release-FreeBSD-${{ matrix.freebsd }}
        path: freebsd-*/
