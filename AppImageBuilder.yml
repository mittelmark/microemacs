# appimage-builder recipe - see https://appimage-builder.readthedocs.io
#
# Normally not called by hand but through the make file:
#
#   make -f unixgcc.gmk app-image
#
# which stages the AppDir in appimage-build/AppDir from the locally built
# standalone binary (linux-*-mecwb.bin) and passes its location with
# --appdir (the "path" key below is documentation only, appimage-builder
# uses the --appdir option). The version is taken from the environment:
#
#   JME_VERSION=<version> appimage-builder --recipe AppImageBuilder.yml \
#       --appdir appimage-build/AppDir
#
# Distro-neutral recipe: bundles nothing and uses the shared libraries of
# the host. The resulting AppImage needs a host with:
#
#   glibc >= 2.36        (Debian 12+, Ubuntu 22.04+, Fedora 36+, Arch, ...)
#   libX11.so.6          (libx11-6 / libX11)
#   libXft.so.2          (libxft2 / libXft)
#   libtinfo.so.6        (libncurses6 / ncurses-libs)
#   libz.so.1            (zlib1g / zlib)
#
# which are present on any desktop Linux system that can run a GUI editor.
#
# Packaging uses appimage-builder with --skip-build: the AppDir is staged by
# the makefile (see unixgcc.gmk) and packaged as-is. The tracked AppRun
# script in jme.AppDir/AppRun stays the entry point; it runs jme through the
# host dynamic linker /lib64/ld-linux-x86-64.so.2 and sets up spelling data.
# (A full appimage-builder build would replace AppRun with its AppRun ELF
# and require AppRun.env; the script approach avoids that machinery and the
# old corrupted bundled-glibc runtime.)
#
version: 1
script:
  - test -x "$TARGET_APPDIR/usr/bin/jme" || (echo "AppDir is not staged - run 'make -f unixgcc.gmk app-image'" >&2; exit 1)
  - test -x "$TARGET_APPDIR/AppRun" || (echo "AppDir AppRun script missing" >&2; exit 1)
AppDir:
  path: appimage-build/AppDir
  app_info:
    id: jme
    name: Jasspa MicroEmacs 09
    icon: jme256
    version: "{{JME_VERSION}}"
    exec: usr/bin/jme
    exec_args: "$@"
AppImage:
  arch: x86_64
  file_name: Jasspa_MicroEmacs_{{JME_VERSION}}_x86_64.AppImage
