# appimage-builder recipe (Debian/Ubuntu variant)
# - see https://appimage-builder.readthedocs.io
#
# Normally not called by hand but through the make file:
#
#   make -f unixgcc.gmk app-image
#
# On a Debian/Ubuntu host "unixgcc.gmk" selects this recipe automatically
# (AppImageBuilder.yml is the distro-neutral variant which uses the shared
# libraries of the host). This recipe bundles the X11/ncurses libraries and
# libc from the distribution packages, the resulting AppImage therefore
# carries its own glibc and runs on Debian/Ubuntu releases older than the
# one it was built on.
#
# Two environment variables are required, both are provided by the make
# file (taken from src/evers.h and /etc/os-release):
#
#   JME_VERSION=<version>          e.g. 091226b6
#   JME_APT_SOURCELINE=<line>      e.g. deb [arch=amd64] http://archive.ubuntu.com/ubuntu/ jammy main restricted universe multiverse
#
# Manual run on Debian bookworm:
#
#   JME_VERSION=091226b6 \
#   JME_APT_SOURCELINE='deb [arch=amd64] http://deb.debian.org/debian/ bookworm main' \
#       appimage-builder --recipe AppImageBuilder.apt.yml --appdir appimage-build/AppDir
#
# Notes:
#
#  * arch is "amd64" only, "AppImage.arch" is "x86_64" as well
#  * appimage-builder excludes some packages by default (fontconfig-config,
#    x11-common, libx11-data, ... see modules/deploy/apt/listings.py) and
#    only downloads packages listed below together with their dependencies,
#    everything excluded here has to be present on the target system.
#    "libfontconfig1" ships without "/etc/fonts", the host configuration is
#    used instead which is what every system with Xft has anyway
#
version: 1
script:
  - test -x "$TARGET_APPDIR/usr/bin/jme" || (echo "AppDir is not staged - run 'make -f unixgcc.gmk app-image'" >&2; exit 1)
AppDir:
  path: appimage-build/AppDir
  app_info:
    id: jme
    name: Jasspa MicroEmacs 09
    icon: jme256
    version: "{{JME_VERSION}}"
    exec: usr/bin/jme
    exec_args: "$@"
  apt:
    arch:
      - amd64
    allow_unauthenticated: true
    sources:
      - sourceline: "{{JME_APT_SOURCELINE}}"
    include:
      # direct NEEDED entries of the mec/mew/mecw binary
      - libx11-6
      - libxft2
      - libncurses6
      - libtinfo6
      - zlib1g
      # dependencies of the above which appimage-builder excludes by default
      # (they would be taken for "already installed" and skipped otherwise)
      - libxcb1
      - libfontconfig1
      - libfreetype6
      - libxrender1
    # "libc6" and friends are pulled in as dependencies on purpose, the
    # runtime moves them to runtime/compat and the bundle uses its own glibc
  files:
    exclude:
      - etc/**
      - usr/share/man
      - usr/share/doc
  after_runtime: |
    mv "$TARGET_APPDIR/AppRun" "$TARGET_APPDIR/AppRun.aib"
    mv "$TARGET_APPDIR/AppRun.env" "$TARGET_APPDIR/AppRun.aib.env"
    mv "$TARGET_APPDIR/AppRun.jme" "$TARGET_APPDIR/AppRun"
    chmod 755 "$TARGET_APPDIR/AppRun" "$TARGET_APPDIR/AppRun.aib"
AppImage:
  arch: x86_64
  file_name: Jasspa_MicroEmacs_{{JME_VERSION}}_x86_64.AppImage
